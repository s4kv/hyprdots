# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

# Git status fetcher, provided by plugins/git.yazi.
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# [[plugin.prepend_previewers]]
# mime = "image/*"
# exec = "noop"
# run = "noop"

[mgr]
ratio = [2, 2, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = false
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
tab_size = 2
max_width = 600
max_height = 900
cache_dir = ""
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", block = true, for = "unix" },
  { run = "code %s", orphan = true, for = "windows" },
]
open = [
  { run = "xdg-open %s1", desc = "Open", for = "linux" },
  { run = "open %s", desc = "Open", for = "macos" },
  { run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
  { run = "xdg-open %d1", desc = "Reveal", for = "linux" },
  { run = "open -R %s1", desc = "Reveal", for = "macos" },
  { run = 'explorer /select,%s1', orphan = true, desc = "Reveal", for = "windows" },
  { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  # use ouch to extract archives
  { run = "ouch d -y %s", desc = "Extract here with ouch" },
]
play = [
  { run = "mpv %s", orphan = true, for = "unix" },
  { run = "mpv %s1", orphan = true, for = "windows" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
